<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6bed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">今天</h1>
    <div class="topbar-actions">
      <span id="syncState" class="sync-state"></span>
      <button class="icon-btn" id="btnSync" title="重新同步" aria-label="重新同步">⟳</button>
      <button class="icon-btn" id="btnSettings" title="設定" aria-label="設定">⚙</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button id="fab" class="fab" aria-label="新增">＋</button>

  <nav class="tabbar">
    <button data-view="today" class="active"><span>☀</span>今天</button>
    <button data-view="money"><span>$</span>記帳</button>
    <button data-view="tasks"><span>✓</span>待辦</button>
    <button data-view="calendar"><span>▦</span>行事曆</button>
    <button data-view="routines"><span>↻</span>習慣</button>
    <button data-view="notes"><span>✎</span>筆記</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="關閉">✕</button>
      </div>
      <form id="modalForm" autocomplete="off"></form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
